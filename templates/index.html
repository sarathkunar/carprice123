<!-- ==========================================
FULL SINGLE FILE UI
AI CAR PRICE PREDICTION
SAVE AS: templates/index.html
========================================== -->

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AI Car Price Prediction</title>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        /* ==========================================
        GLOBAL
        ========================================== */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#020617;
            color:white;
            min-height:100vh;
            overflow-x:hidden;
        }

        /* ==========================================
        BACKGROUND
        ========================================== */

        .background{
            position:fixed;
            width:100%;
            height:100%;
            background:
                radial-gradient(circle at top left,#2563eb55,transparent 30%),
                radial-gradient(circle at bottom right,#7c3aed55,transparent 30%);
            z-index:-1;
        }

        /* ==========================================
        MAIN CONTAINER
        ========================================== */

        .container{
            width:95%;
            max-width:1600px;
            margin:30px auto;
            display:flex;
            border-radius:30px;
            overflow:hidden;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(18px);
            box-shadow:0 10px 40px rgba(0,0,0,0.5);
        }

        /* ==========================================
        LEFT PANEL
        ========================================== */

        .left-panel{
            width:35%;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            padding:50px 35px;
            text-align:center;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
        }

        .logo{
            width:90px;
            height:90px;
            border-radius:25px;
            background:white;
            color:#2563eb;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
            margin-bottom:25px;
        }

        .left-panel h1{
            font-size:42px;
            margin-bottom:20px;
        }

        .left-panel p{
            color:#e2e8f0;
            line-height:1.9;
            margin-bottom:35px;
        }

        .left-panel img{
            width:320px;
            animation:float 4s infinite ease-in-out;
        }

        @keyframes float{

            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(-18px);
            }

            100%{
                transform:translateY(0px);
            }

        }

        /* ==========================================
        RIGHT PANEL
        ========================================== */

        .right-panel{
            width:65%;
            padding:45px;
        }

        .form-title h2{
            font-size:32px;
            margin-bottom:8px;
        }

        .form-title p{
            color:#94a3b8;
            margin-bottom:30px;
        }

        /* ==========================================
        ROWS
        ========================================== */

        .row{
            display:flex;
            gap:20px;
            margin-bottom:22px;
        }

        /* ==========================================
        INPUT BOX
        ========================================== */

        .input-box{
            flex:1;
            display:flex;
            flex-direction:column;
        }

        .input-box label{
            margin-bottom:8px;
            color:#cbd5e1;
            font-size:14px;
        }

        /* ==========================================
        INPUTS
        ========================================== */

        input,
        select{
            width:100%;
            padding:15px;
            border:none;
            outline:none;
            border-radius:16px;
            background:rgba(255,255,255,0.08);
            color:white;
            border:1px solid rgba(255,255,255,0.08);
            transition:0.3s;
        }

        input::placeholder{
            color:#94a3b8;
        }

        select option{
            background:#0f172a;
        }

        input:focus,
        select:focus{
            border:1px solid #60a5fa;
            transform:translateY(-2px);
        }

        /* ==========================================
        BUTTON
        ========================================== */

        .predict-btn{
            width:100%;
            padding:18px;
            border:none;
            border-radius:18px;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            font-size:18px;
            font-weight:700;
            cursor:pointer;
            margin-top:20px;
            transition:0.3s;
        }

        .predict-btn:hover{
            transform:translateY(-3px);
        }

        /* ==========================================
        RESULT
        ========================================== */

        .result{
            margin-top:30px;
            padding:25px;
            border-radius:20px;
            background:rgba(74,222,128,0.08);
            text-align:center;
        }

        .result h2{
            color:#4ade80;
            font-size:30px;
        }

        /* ==========================================
        RESPONSIVE
        ========================================== */

        @media(max-width:1100px){

            .container{
                flex-direction:column;
            }

            .left-panel,
            .right-panel{
                width:100%;
            }

        }

        @media(max-width:850px){

            .row{
                flex-direction:column;
            }

        }

    </style>

</head>

<body>

    <!-- BACKGROUND -->

    <div class="background"></div>

    <!-- MAIN CONTAINER -->

    <div class="container">

        <!-- LEFT PANEL -->

        <div class="left-panel">

            <div class="logo">

                <i class="fa-solid fa-car-side"></i>

            </div>

            <h1>AI Car Price Prediction</h1>

            <p>
                Smart Machine Learning based
                showroom car price prediction system.
            </p>

            <img src="https://cdn-icons-png.flaticon.com/512/3085/3085330.png">

        </div>

        <!-- RIGHT PANEL -->

        <div class="right-panel">

            <div class="form-title">

                <h2>Vehicle Information</h2>

                <p>
                    Fill all vehicle specifications carefully
                    for accurate AI prediction.
                </p>

            </div>

            <!-- FORM -->

            <form action="/predict" method="POST">

                <!-- ROW 1 -->

                <div class="row">

                    <div class="input-box">

                        <label>Make</label>

                        <select name="Make">

                            <option>Toyota</option>
                            <option>Honda</option>
                            <option>Hyundai</option>
                            <option>Kia</option>
                            <option>Tata</option>
                            <option>BMW</option>
                            <option>Audi</option>
                            <option>Mercedes-Benz</option>
                            <option>Volkswagen</option>
                            <option>Skoda</option>
                            <option>Ford</option>
                            <option>MG</option>
                            <option>Mahindra</option>

                        </select>

                    </div>

                    <div class="input-box">

                        <label>Model</label>

                        <input type="text"
                            name="Model"
                            placeholder="Enter Model">

                    </div>

                    <div class="input-box">

                        <label>Variant</label>

                        <input type="text"
                            name="Variant"
                            placeholder="Enter Variant">

                    </div>

                </div>

                <!-- ROW 2 -->

                <div class="row">

                    <div class="input-box">

                        <label>Fuel Type</label>

                        <select name="Fuel_Type">

                            <option>Petrol</option>
                            <option>Diesel</option>
                            <option>Electric</option>
                            <option>Hybrid</option>
                            <option>CNG</option>

                        </select>

                    </div>

                    <div class="input-box">

                        <label>Body Type</label>

                        <select name="Body_Type">

                            <option>SUV</option>
                            <option>Sedan</option>
                            <option>Hatchback</option>
                            <option>MUV</option>

                        </select>

                    </div>

                    <div class="input-box">

                        <label>Engine Type</label>

                        <select name="Engine_Type">

                            <option>Petrol Engine</option>
                            <option>Diesel Engine</option>
                            <option>Electric Motor</option>

                        </select>

                    </div>

                </div>

                <!-- ROW 3 -->

                <div class="row">

                    <div class="input-box">

                        <label>Power (bhp)</label>

                        <input type="number"
                            name="Power"
                            placeholder="141">

                    </div>

                    <div class="input-box">

                        <label>Torque (Nm)</label>

                        <input type="number"
                            name="Torque"
                            placeholder="250">

                    </div>

                    <div class="input-box">

                        <label>Gears</label>

                        <select name="Gears">

                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>

                        </select>

                    </div>

                </div>

                <!-- ROW 4 -->

                <div class="row">

                    <div class="input-box">

                        <label>City Mileage</label>

                        <input type="number"
                            name="City_Mileage"
                            placeholder="18">

                    </div>

                    <div class="input-box">

                        <label>Wheelbase</label>

                        <input type="number"
                            name="Wheelbase"
                            placeholder="2600">

                    </div>

                    <div class="input-box">

                        <label>Ground Clearance</label>

                        <input type="number"
                            name="Ground_Clearance"
                            placeholder="190">

                    </div>

                </div>

                <!-- ROW 5 -->

                <div class="row">

                    <div class="input-box">

                        <label>Seating Capacity</label>

                        <select name="Seating_Capacity">

                            <option>2</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>

                        </select>

                    </div>

                    <div class="input-box">

                        <label>Airbags</label>

                        <select name="Airbags">

                            <option>0</option>
                            <option>2</option>
                            <option>4</option>
                            <option>6</option>
                            <option>8</option>

                        </select>

                    </div>

                    <div class="input-box">

                        <label>Cruise Control</label>

                        <select name="Cruise_Control">

                            <option>Yes</option>
                            <option>No</option>

                        </select>

                    </div>

                </div>

                <!-- ROW 6 -->

                <div class="row">

                    <div class="input-box">

                        <label>Android Auto</label>

                        <select name="Android_Auto">

                            <option>Yes</option>
                            <option>No</option>

                        </select>

                    </div>

                    <div class="input-box">

                        <label>Apple CarPlay</label>

                        <select name="Apple_CarPlay">

                            <option>Yes</option>
                            <option>No</option>

                        </select>

                    </div>

                    <div class="input-box">

                        <label>Turbocharger</label>

                        <select name="Turbocharger">

                            <option>Yes</option>
                            <option>No</option>

                        </select>

                    </div>

                </div>

                <!-- ROW 7 -->

                <div class="row">

                    <div class="input-box">

                        <label>Battery</label>

                        <select name="Battery">

                            <option>No Battery</option>
                            <option>Lithium-Ion</option>
                            <option>Lead Acid</option>

                        </select>

                    </div>

                    <div class="input-box">

                        <label>Electric Range</label>

                        <input type="number"
                            name="Electric_Range"
                            placeholder="450">

                    </div>

                </div>

                <!-- BUTTON -->

                <button class="predict-btn">

                    <i class="fa-solid fa-brain"></i>

                    Predict Car Price

                </button>

            </form>

            <!-- RESULT -->

            <div class="result">

                <h2>{{ prediction_text }}</h2>

            </div>

        </div>

    </div>

    <!-- SCRIPT -->

    <script>

        console.log("AI Car Price Prediction Loaded");

        const form = document.querySelector("form");

        const button = document.querySelector(".predict-btn");

        form.addEventListener("submit", () => {

            button.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Predicting...';

            button.disabled = true;

        });

    </script>

</body>

</html>
